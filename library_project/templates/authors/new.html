{% extends "base.html" %}
{% block title %}Ajouter un nouvel auteur{% endblock %}
{% block content %}
    <h1>Ajouter un nouvel auteur</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Créer</button>
    </form>
    <a class="btn btn-secondary mt-3" href="{% url 'index_author' %}">Retour à la liste des auteurs</a>
{% endblock %}
