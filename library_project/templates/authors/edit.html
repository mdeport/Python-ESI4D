{% extends "base.html" %}
{% block title %}Modifier l'auteur{% endblock %}
{% block content %}
    <h1>Modifier l'auteur : {{ author.first_name }} {{ author.last_name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </form>
    <a class="btn btn-secondary mt-3" href="{% url 'show_author' author.id %}">Retour aux détails de l'auteur</a>
{% endblock %}
