{% extends "base.html" %}
{% block title %}Détails de l'auteur{% endblock %}
{% block content %}
  <h1>{{ author.first_name }} {{ author.last_name }}</h1>
  <p>Date de naissance : {{ author.birth_date }}</p>
  <p>Nationalité : {{ author.nationality }}</p>
  <a href="{% url 'index_author' %}">Retour à la liste des auteurs</a>
{% endblock %}
