{% extends "base.html" %}
{% block title %}Ajouter un nouveau livre{% endblock %}
{% block content %}
    <h1>Ajouter un nouveau livre</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit">Créer</button>
    </form>
    <a href="{% url 'index_book' %}">Retour à la liste des livres</a>
{% endblock %}
