<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Prêts</title>
</head>
<body>
  <h1>Liste des prêts</h1>
  <a href="{% url 'new_loan' %}">Créer un prêt</a>
  <ul>
    {% for loan in loans %}
      <li>{{ loan.book.title }} — emprunteur: {{ loan.name_borrower }} — prêt le: {{ loan.date_loan }} — statut: {{ loan.state_book_returned }}</li>
    {% empty %}
      <li>Aucun prêt.</li>
    {% endfor %}
  </ul>
</body>
</html>
