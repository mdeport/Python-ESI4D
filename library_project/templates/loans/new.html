{% extends "base.html" %}
{% block title %}Ajouter un nouvel emprunt{% endblock %}
{% block content %}
  <h1>Nouvel emprunt</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Créer l'emprunt</button>
  </form>

  <a class="btn btn-secondary" href="{% url 'index_loans' %}">Retour à la liste des prêts</a>
{% endblock %}
