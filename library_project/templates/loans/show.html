{% extends "base.html" %}
{% block title %}Détails du livre{% endblock %}
{% block content %}
  <h1>{{ book.title }}</h1>
  <p>Auteur : {{ book.author }}</p>
  <p>ISBN : {{ book.isbn }}</p>
  <p>Prix : {{ book.price }}</p>
  <p>Date de publication : {{ book.published_date }}</p><br>
  <a href="{% url 'index_book' %}">Retour à la liste des livres</a> 
{% endblock %}
