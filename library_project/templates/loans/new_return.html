<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un nouveau retour</title>
</head>
<body>
    <h1>Ajouter un nouveau retour</h1>
    <form method="post">
        {% csrf_token %}
        
        <label for="loan">Emprunt :</label>
        <select id="loan" name="loan" required>
            <option value="">— Choisir —</option>
            {% for loan in loans %}
                <option value="{{ loan.id }}">{{ loan }}</option>
            {% endfor %}
        </select><br>

        <label for="date_returned">Date de retour :</label>
        <input type="date" id="date_returned" name="date_returned" required><br>

        <button type="submit">Créer</button>
    </form>
    <a href="{% url 'index_loan' %}">Retour à la liste des emprunts</a>
</body>
</html>
