{% extends "base.html" %}
{% block title %}Modifier le livre{% endblock %}
{% block content %}
    <h1>Modifier le livre : {{ book.title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </form>
    <a class="btn btn-secondary mt-3" href="{% url 'show_category' category.id %}">Retour aux détails de la catégorie</a>
{% endblock %}
