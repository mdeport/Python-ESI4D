{% extends "base.html" %}
{% block title %}Ajouter une nouvelle catégorie{% endblock %}
{% block content %}
    <h1>Ajouter une nouvelle catégorie</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Créer</button>
    </form>
    <a class="btn btn-secondary" href="{% url 'index_category' %}">Retour à la liste des catégories</a>
{% endblock %}
